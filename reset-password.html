<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — The United Citizens of America</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#c6a45d;--bg:#0d0f14;--panel:#151923;--text:#e8e4d8;--muted:#9a958a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Libre Franklin',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{padding:20px;text-align:center;border-bottom:1px solid rgba(198,164,93,.25)}
  header h1{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--gold)}
  header p{color:var(--muted);font-size:.85rem;margin-top:4px}
  main{flex:1;max-width:560px;width:100%;margin:0 auto;padding:28px 16px;text-align:center}
  .card{background:var(--panel);border:1px solid rgba(198,164,93,.3);border-radius:12px;padding:24px 20px}
  .card p{line-height:1.55;font-size:.95rem}
  .card label{display:block;text-align:left;font-size:.85rem;color:var(--muted);margin:14px 0 2px}
  input{display:block;width:100%;background:var(--bg);border:1px solid rgba(198,164,93,.3);border-radius:20px;color:var(--text);padding:12px 16px;font-size:.95rem;font-family:inherit;margin:6px 0}
  input:focus{border-color:var(--gold);outline:none}
  input:disabled{opacity:.6}
  button{background:var(--gold);border:none;color:#111;border-radius:20px;padding:12px 24px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.95rem;margin-top:14px}
  button:disabled{opacity:.5;cursor:default}
  #msg{color:var(--muted);font-size:.9rem;margin-top:12px;line-height:1.5}
  #msg.error{color:#e8a0a0}
  #msg.ok{color:#a8d5a2}
  a{color:var(--gold)}
  footer{text-align:center;color:var(--muted);font-size:.75rem;padding:16px}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<nav style="max-width:760px;width:100%;margin:0 auto;padding:12px 16px 0;text-align:center;font-size:.9rem"><a href="./">← Back to thecitizenmovement.org</a></nav>
<header>
  <h1>Reset your password</h1>
  <p>The United Citizens of America</p>
</header>
<main>
  <div class="card" id="card">
    <p id="status">Checking your reset link…</p>
    <div id="form" style="display:none">
      <label for="reset-email">Email</label>
      <input id="reset-email" type="email" autocomplete="email">
      <label for="new-pass">New password</label>
      <input id="new-pass" type="password" autocomplete="new-password" placeholder="New password">
      <label for="verify-pass">Verify new password</label>
      <input id="verify-pass" type="password" autocomplete="new-password" placeholder="Verify new password">
      <button id="btn-reset" type="button">Reset password</button>
    </div>
    <p id="msg"></p>
    <p id="alt" style="display:none;margin-top:14px;font-size:.9rem"><a href="https://thecitizenmovement.store/reset-password.html">Send a new reset link</a></p>
  </div>
  <p style="margin-top:16px;font-size:.9rem"><a href="./">Back to sign in</a></p>
</main>
<footer><a href="./">The United Citizens of America</a> · thecitizenmovement.org</footer>
<script>
/* Dedicated password-reset page (2026-11-06). The reset email link points
   here directly (redirectTo), so the user never lands on the home page or
   the regular sign-in panel. The link carries type=recovery in the URL hash;
   the Supabase client picks the session up from the hash automatically. */
var SUPABASE_URL = "https://jesrbqrwbacuirwxbkis.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Implc3JicXJ3YmFjdWlyd3hia2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NTU2OTcsImV4cCI6MjEwNzIzMTY5N30._LCnNC2JIjijt6n0u3kKestF5G2Zsjju4hEv1d1tImc";
var client = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function showMsg(text, kind){
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = kind || '';
}
function hasRecoveryHash(){
  var h = window.location.hash || '';
  return h.indexOf('type=recovery') !== -1 || h.indexOf('access_token=') !== -1;
}
async function init(){
  var status = document.getElementById('status');
  var form = document.getElementById('form');
  var alt = document.getElementById('alt');
  if (!client) {
    status.textContent = 'Sign-in library failed to load — check your connection and reload this page.';
    alt.style.display = 'block';
    return;
  }
  if (!hasRecoveryHash()) {
    status.textContent = 'This page needs a reset link. Use the link in your reset email — it is good for 60 minutes. If it expired, send yourself a new one.';
    alt.style.display = 'block';
    return;
  }
  /* Give the client a moment to turn the hash into a session. */
  var session = null;
  for (var i = 0; i < 10; i++) {
    var r = await client.auth.getSession();
    if (r && r.data && r.data.session) { session = r.data.session; break; }
    await new Promise(function(res){ setTimeout(res, 500); });
  }
  if (!session) {
    status.textContent = 'That reset link expired or was already used. Send yourself a new one — it is good for 60 minutes.';
    alt.style.display = 'block';
    return;
  }
  var email = (session.user && session.user.email) || '';
  document.getElementById('reset-email').value = email;
  status.style.display = 'none';
  form.style.display = 'block';
}
document.getElementById('btn-reset').addEventListener('click', async function(){
  var email = document.getElementById('reset-email').value.trim();
  var a = document.getElementById('new-pass').value;
  var b = document.getElementById('verify-pass').value;
  if (!email) { showMsg('Enter your email.', 'error'); return; }
  if (!a || a.length < 6) { showMsg('New password must be at least 6 characters.', 'error'); return; }
  if (a !== b) { showMsg('The two passwords do not match.', 'error'); return; }
  var btn = document.getElementById('btn-reset');
  btn.disabled = true; btn.textContent = 'Resetting…';
  showMsg('Resetting your password…');
  var r = await client.auth.updateUser({ password: a });
  btn.disabled = false; btn.textContent = 'Reset password';
  if (r.error) { showMsg(r.error.message, 'error'); return; }
  /* Clean the token out of the address bar. */
  try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
  document.getElementById('form').style.display = 'none';
  showMsg('Password changed. You can now sign in with your new password.', 'ok');
});
document.getElementById('verify-pass').addEventListener('keydown', function(e){
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-reset').click(); }
});
init();
</script>
</body>
</html>
